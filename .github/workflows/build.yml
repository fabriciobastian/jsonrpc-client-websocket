name: 📦 Build

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Install and build
        run: |
          npm ci
          npm run build
      - name: Test
        run: npm run test
      - name: Lint
        run: npm run lint
